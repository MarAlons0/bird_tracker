name: Daily Trip Reports

# Sends any scheduled trip reports due today (one day before each trip stop's
# arrival). Populated by the TripPlanner integration; see
# docs/TRIPPLANNER_INTEGRATION.md. Render has no built-in scheduler, so this
# GitHub Actions cron drives it.
on:
  schedule:
    - cron: '0 10 * * *'    # daily at 10:00 UTC
  workflow_dispatch: {}      # allow manual runs from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # Wake the free-tier service before the heavier request (see weekly-report).
      - name: Wake the service
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 -o /dev/null "${{ secrets.APP_BASE_URL }}/favicon.ico"; then
              echo "Service is awake (attempt $i)"
              sleep 5
              exit 0
            fi
            echo "Waiting for service to wake (attempt $i)..."
            sleep 15
          done
          echo "Service did not wake within the allotted time" >&2
          exit 1

      - name: Send due trip reports
        run: |
          curl -fsS --retry 2 --retry-delay 10 --max-time 200 -X POST \
            -H "Authorization: Bearer ${{ secrets.REPORT_CRON_TOKEN }}" \
            "${{ secrets.APP_BASE_URL }}/api/send-due-reports"
